<!DOCTYPE html>
<html lang="ja">

<!--============================================================-->
<!--メタデータの設定-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0">
    <title>フォト</title>
    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">

</head>

<!--============================================================-->
<!--本文-->
<body>

    <h3>PhotoManager</h3>

    <div class="storageBox">

        <div class="storageCircle">

            <span id="storagePercent">
                0%
            </span>

        </div>

        <div id="storageInfo">

            使用量計算中...

        </div>

    </div>

    <div class="searchArea">
        <!--ストレージ-->
        

        <!--バックアップ-->
        <button id="backupButton">
            バックアップ保存
        </button>

        <button id="restoreButton">
            バックアップ読込
        </button>
        
        <br><br>

        <input
            type="file"
            id="restoreInput"
            accept=".json"
            hidden>

        <!--写真を選択させる-->
        <input type="file" id="photoInput" accept="image/*" multiple>
        <input type="text" id="tagSearch" placeholder="タグ検索">
        <div class="counter">
            <div id="tagcount">ヒット: 0件</div>
            <div id="photocount">/0件</div>
        </div>

    </div>

    <div id="photoArea"></div>

    <!-- 拡大表示 -->
    <div id="modal">
        
        <img id="largeImage">

        <div>
            <button id="prevButton">◀</button>

            <button id="nextButton">▶</button>
        </div>
        
        <button id="closeButton">X</button>

    </div>


    <script src="script.js"></script>

</body>
<!---------------------------------------------------------------->
</html>
